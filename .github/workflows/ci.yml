name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    name: Build + Test (${{ matrix.build_type }}, ${{ matrix.sanitizer }})
    runs-on: ubuntu-22.04

    strategy:
      matrix:
        include:
          - build_type: Release
            sanitizer: none
          - build_type: RelWithDebInfo
            sanitizer: tsan
          - build_type: RelWithDebInfo
            sanitizer: asan

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y cmake ninja-build g++-12 libboost-dev
          sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-12 100

      - name: Configure
        run: |
          EXTRA=""
          [ "${{ matrix.sanitizer }}" = "tsan" ] && EXTRA="-DTSAN=ON"
          [ "${{ matrix.sanitizer }}" = "asan" ] && EXTRA="-DASAN=ON"
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} $EXTRA

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure --timeout 120
